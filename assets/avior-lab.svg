<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Avior Kasay — AI Solutions and Automation</title>
  <desc id="desc">A dark engineering lab banner with mint typography and an orbital system illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1421"/><stop offset="1" stop-color="#102737"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8af0c8"/><stop offset="1" stop-color="#63cbe5"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#4cd7b1" stop-opacity=".17"/><stop offset="1" stop-color="#4cd7b1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a8d8da" stroke-opacity=".045"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}
      .satellite{transform-origin:972px 194px;animation:orbit 28s linear infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.satellite{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="390" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="388" rx="21" fill="url(#grid)" stroke="#29404b"/>
  <circle cx="970" cy="195" r="245" fill="url(#glow)"/>
  <g class="mono" font-size="15" letter-spacing="2">
    <circle cx="54" cy="48" r="5" fill="#87efc7"/>
    <text x="71" y="53" fill="#a8c1cb">AVIOR / LAB</text>
    <text x="1148" y="53" text-anchor="end" fill="#7e9aa9" font-size="12">BUILD · CONNECT · VERIFY</text>
  </g>
  <text x="48" y="159" class="sans" font-size="78" font-weight="700" letter-spacing="-3" fill="#f1f7fa">Avior Kasay<tspan fill="#8af0c8">.</tspan></text>
  <text x="52" y="209" class="sans" font-size="28" fill="url(#accent)">AI Solutions &amp; Automation</text>
  <text x="52" y="256" class="sans" font-size="20" fill="#afc3ce">Turning business workflows into working systems.</text>
  <g class="mono" font-size="13" fill="#b9d2db">
    <rect x="52" y="301" width="130" height="34" rx="8" fill="#172e3b" stroke="#2c4956"/><text x="117" y="323" text-anchor="middle">AI WORKFLOWS</text>
    <rect x="194" y="301" width="130" height="34" rx="8" fill="#172e3b" stroke="#2c4956"/><text x="259" y="323" text-anchor="middle">INTEGRATIONS</text>
    <rect x="336" y="301" width="130" height="34" rx="8" fill="#172e3b" stroke="#2c4956"/><text x="401" y="323" text-anchor="middle">AUTOMATION</text>
  </g>
  <g fill="none" stroke="#476979">
    <circle cx="972" cy="194" r="119" stroke-opacity=".45"/>
    <circle cx="972" cy="194" r="153" stroke-opacity=".2" stroke-dasharray="3 9"/>
    <ellipse cx="972" cy="194" rx="168" ry="58" transform="rotate(-28 972 194)" stroke="#71d7c1" stroke-opacity=".5"/>
    <ellipse cx="972" cy="194" rx="168" ry="58" transform="rotate(48 972 194)" stroke-opacity=".5"/>
  </g>
  <g class="satellite"><circle cx="972" cy="75" r="7" fill="#8af0c8"/><circle cx="972" cy="75" r="14" fill="#8af0c8" opacity=".08"/></g>
  <circle cx="972" cy="194" r="53" fill="#122c3a" stroke="#477266"/>
  <path d="m949 216 23-48 23 48m-37-14h28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="972" y="368" text-anchor="middle" class="mono" font-size="11" letter-spacing="3" fill="#7f9eaa">SYSTEMS THINKING</text>
</svg>
